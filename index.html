<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>全国位置情報・実績解除アプリ</title>

    <!-- PWA対応: ホーム画面に追加してアプリのように使えるようにする -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111216">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅アプリ">

    <!-- 🛟 起動フェイルセーフ: CDN等が読み込めない場合、一定時間後に再読み込みUIを表示する -->
    <!-- このスクリプトはどの外部リソースより前に置き、パース時に即実行させる -->
    <script>
        window.__bootFailSafeId = setTimeout(function () {
            var boot = document.getElementById('boot-screen');
            if (boot && boot.style.display !== 'none') {
                boot.innerHTML =
                    '<div style="text-align:center;color:#fff;padding:0 20px;">' +
                    '<p style="margin-bottom:20px;line-height:1.6;font-size:0.95rem;">読み込みに時間がかかっています。<br>' +
                    'ネットワーク接続（Wi-Fi/モバイル回線）をご確認のうえ、<br>再読み込みしてください。</p>' +
                    '<button onclick="location.reload()" style="padding:12px 28px;background:#fff;color:#111216;border:none;border-radius:12px;font-weight:700;font-size:0.9rem;cursor:pointer;">再読み込み</button>' +
                    '</div>';
            }
        }, 12000);
    </script>

    <!-- Leaflet.js のCSSとJS（jsdelivrを優先、失敗時はunpkgへ自動フォールバック） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <script>
        window.__leafletLoadFailed = function () {
            console.warn('jsdelivrからのLeaflet読み込みに失敗。unpkgへフォールバックします。');
            var s = document.createElement('script');
            s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            s.defer = true;
            document.head.appendChild(s);
        };

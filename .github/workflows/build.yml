name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --stacktrace > build_output.log 2>&1
        continue-on-error: true

      - name: Save error log on failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 60000 build_output.log > BUILD_ERROR.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add BUILD_ERROR.log
          git commit -m "ci: record build error log [skip ci]" || true
          git push origin HEAD:main

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harumaki-debug-apk
          path: app/build/outputs/apk/debug/*.apk
